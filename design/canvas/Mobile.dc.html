<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Design Thinking Class C — First Semester, 2026</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Caveat:wght@500;700&amp;family=Kaushan+Script&amp;family=Permanent+Marker&amp;family=Pinyon+Script&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background-color: #ECEBE8">
  <dc-import name="Main" width="{{w}}" height="{{h}}" headline-font="{{font}}" reduced-motion="{{reduced}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"headlineFont":{"editor":"enum","options":["brush","marker","script"],"default":"brush"},"reducedMotion":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      w: 390,
      h: 844,
      font: this.props.headlineFont ?? 'brush',
      reduced: !!this.props.reducedMotion,
    };
  }
}
</script>
</body>
</html>
