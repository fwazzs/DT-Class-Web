<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thank you — student feedback</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Caveat:wght@500;700&amp;family=Kaushan+Script&amp;family=Permanent+Marker&amp;family=Pinyon+Script&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<section aria-label="Thank you" style="position: relative; width: {{W}}px; box-sizing: border-box; padding: {{L.pad}}; overflow: hidden; background-color: #C9A47E; background-image: radial-gradient(70% 60% at 50% 18%, rgba(255,240,215,0.35), rgba(255,240,215,0) 70%), radial-gradient(rgba(110,74,40,0.55) 0.9px, transparent 1.3px), radial-gradient(rgba(236,206,166,0.75) 0.8px, transparent 1.2px); background-size: 100% 100%, 7px 7px, 11px 11px; background-position: 0 0, 0 0, 3px 5px; box-shadow: inset 0 14px 0 #3A2E25, inset 0 -14px 0 #3A2E25, inset 0 20px 24px -8px rgba(0,0,0,0.35); font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #17181A">

  <!-- Title on a paper banner -->
  <div style="position: relative; margin: 0 auto; width: {{L.bannerW}}px; max-width: 100%; box-sizing: border-box; padding: {{L.bannerPad}}; background-color: #FBFAF6; box-shadow: 0 2px 3px rgba(40,30,20,0.2), 0 24px 40px -18px rgba(40,30,20,0.5); transform: rotate(-1deg) translateY({{hd.ty}}px); opacity: {{hd.op}}; text-align: center">
    <div aria-hidden="true" style="position: absolute; top: -12px; left: 12%; width: 100px; height: 26px; background-color: rgba(255,228,92,0.7); transform: rotate(-6deg); box-shadow: 0 1px 1px rgba(0,0,0,0.08)"></div>
    <div aria-hidden="true" style="position: absolute; top: -10px; right: 12%; width: 100px; height: 26px; background-color: rgba(124,200,255,0.6); transform: rotate(5deg); box-shadow: 0 1px 1px rgba(0,0,0,0.08)"></div>
    <p style="margin: 0; font-size: 13px; font-weight: 650; letter-spacing: 0.16em; text-transform: uppercase; color: #3B3934">05 — From all of us</p>
    <h2 style="margin: 6px 0 0; font-family: 'Kaushan Script', cursive; font-weight: 400; font-size: {{L.title}}px; line-height: 1.05; clip-path: inset(-30% {{hd.clip}}% -30% -8%)">Thank you</h2>
    <p style="margin: 6px 0 0; font-size: {{L.sub}}px; font-weight: 500; line-height: 1.35; color: #3B3934">What 50 students of Design Thinking Class C took away this semester.</p>
  </div>

  <!-- Two rows of feedback, drifting in opposite directions; hover pauses a row -->
  <div style="position: relative; margin-top: {{L.rowsTop}}px; display: flex; flex-direction: column; gap: {{L.rowGap}}px; -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent)">
    <sc-for list="{{rows}}" as="row" hint-placeholder-count="2">
      <div onMouseEnter="{{row.pause}}" onMouseLeave="{{row.play}}" style="position: relative; padding: 14px 0; opacity: {{row.op}}">
        <ul aria-label="{{row.label}}" style="list-style: none; margin: 0; padding: 0; display: flex; gap: {{L.gap}}px; width: max-content; transform: translateX({{row.tx}}px)">
          <sc-for list="{{row.cards}}" as="c" hint-placeholder-count="4">
            <li aria-hidden="{{c.dup}}" style="position: relative; flex-shrink: 0; width: {{c.w}}px; height: {{L.cardH}}px; box-sizing: border-box; padding: {{c.pad}}; display: flex; flex-direction: column; background-color: {{c.bg}}; background-image: {{c.pattern}}; box-shadow: 0 2px 3px rgba(40,30,20,0.25), 0 14px 22px -12px rgba(40,30,20,0.45); transform: rotate({{c.rot}}deg)">
              <div aria-hidden="true" style="position: absolute; left: 36%; top: -11px; width: 28%; height: 22px; background-color: rgba(240,234,218,0.85); box-shadow: 0 1px 1px rgba(0,0,0,0.08); transform: rotate({{c.tapeRot}}deg)"></div>
              <p style="margin: 0; flex: 1; font-family: 'Caveat', cursive; font-weight: 700; font-size: {{L.quote}}px; line-height: 1.15; color: #1F1B16">“[Feedback from student {{c.num}}]”</p>
              <div style="display: flex; align-items: center; gap: 10px">
                <span aria-hidden="true" style="position: relative; width: 34px; height: 34px; flex-shrink: 0; overflow: hidden; border-radius: 50%; background-color: #CFCAC0; box-shadow: 0 0 0 2px #FDFCF8">
                  <span style="position: absolute; left: 11px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background-color: #A29C91"></span>
                  <span style="position: absolute; left: 5px; top: 20px; width: 24px; height: 18px; border-radius: 12px 12px 0 0; background-color: #A29C91"></span>
                </span>
                <span style="display: flex; flex-direction: column; line-height: 1.2">
                  <span style="font-size: 14px; font-weight: 700">[Full name]</span>
                  <span style="font-size: 12px; font-weight: 500; color: #3B3934; font-variant-numeric: tabular-nums">NRP [NRP] · Group [nn]</span>
                </span>
              </div>
            </li>
          </sc-for>
        </ul>
      </div>
    </sc-for>
  </div>

  <p style="position: relative; margin: {{L.endTop}}px 0 0; text-align: center; font-family: 'Caveat', cursive; font-weight: 700; font-size: {{L.end}}px; color: #1F1B16; opacity: {{hd.op}}">See you at the next wall of ideas.</p>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"seen":{"editor":"int","default":100000},"live":{"editor":"boolean","default":true},"width":{"editor":null,"default":1440},"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  componentDidMount() {
    this._off = [0, 0];
    this._paused = [false, false];
    let last = 0;
    const tick = (ts) => {
      this._raf = requestAnimationFrame(tick);
      if (this.props.live === false || Number(this.props.seen ?? 100000) <= 0) { last = ts; return; }
      const dt = Math.min(0.1, (ts - (last || ts)) / 1000);
      last = ts;
      // ~40px/s: slow enough to read a card as it passes.
      if (!this._paused[0]) this._off[0] += dt * 40;
      if (!this._paused[1]) this._off[1] += dt * 34;
      if (ts - (this._lastPaint || 0) >= 33) { this._lastPaint = ts; this.setState({ f: ts }); }
    };
    this._raf = requestAnimationFrame(tick);
  }
  componentWillUnmount() {
    cancelAnimationFrame(this._raf);
  }
  renderVals() {
    const W = Number(this.props.width ?? 1440);
    const seen = Number(this.props.seen ?? 100000); // px of this section scrolled into view
    const mobile = W < 700;
    const clamp = (v) => Math.min(1, Math.max(0, v));
    const seg = (v, a, b) => clamp((v - a) / (b - a));
    const inOut = (v) => (v < 0.5 ? 4 * v * v * v : 1 - Math.pow(-2 * v + 2, 3) / 2);
    const L = mobile
      ? { pad: '64px 0 72px', bannerW: 358, bannerPad: '22px 18px 20px', title: 64, sub: 15, rowsTop: 40, rowGap: 12, cardH: 196, gap: 16, quote: 20, cardW: [232, 260, 232], endTop: 28, end: 24 }
      : { pad: '104px 0 112px', bannerW: 760, bannerPad: '30px 40px 28px', title: 128, sub: 18, rowsTop: 64, rowGap: 20, cardH: 210, gap: 28, quote: 24, cardW: [300, 340, 300], endTop: 44, end: 30 };

    // Card styles rotate through the theme's papers: sticky note, ruled index card, kraft card.
    if (!this._cards || this._cardsFor !== W) {
      this._cardsFor = W;
      const NOTES = ['#FFE45C', '#FF8FB1', '#7CC8FF', '#8EE07A', '#FFA552'];
      const RULED = 'linear-gradient(90deg, transparent 33px, rgba(210,70,60,0.4) 33px, rgba(210,70,60,0.4) 35px, transparent 35px), repeating-linear-gradient(180deg, transparent 0 27px, rgba(80,120,190,0.22) 27px 28px)';
      const make = (i, dup) => {
        const kind = i % 3;
        return {
          num: String(i + 1).padStart(2, '0'), dup,
          w: L.cardW[kind],
          bg: kind === 0 ? NOTES[Math.floor(i / 3) % 5] : kind === 1 ? '#FFFEFA' : '#D9B98F',
          pattern: kind === 0 ? 'linear-gradient(180deg, rgba(0,0,0,0.07), rgba(0,0,0,0) 22%)' : kind === 1 ? RULED : 'radial-gradient(rgba(110,74,40,0.18) 0.8px, transparent 1.2px)',
          pad: kind === 1 ? '20px 18px 16px 46px' : '20px 20px 16px',
          rot: ((i * 37) % 7) * 0.5 - 1.5, tapeRot: ((i * 53) % 9) - 4,
        };
      };
      const row = (from) => {
        const base = [];
        for (let i = from; i < from + 25; i++) base.push(make(i, false));
        const width = base.reduce((s, c) => s + c.w + L.gap, 0);
        // Rendered twice so the loop is seamless; the copy is hidden from screen readers.
        return { cards: base.concat(base.map((c) => ({ ...c, dup: true }))), width };
      };
      this._cards = [row(0), row(25)];
      this._handlers = [0, 1].map((r) => ({ pause: () => { if (this._paused) this._paused[r] = true; }, play: () => { if (this._paused) this._paused[r] = false; } }));
    }

    const off = this._off || [0, 0];
    const eTitle = inOut(seg(seen, 80, 520));
    const eRows = inOut(seg(seen, 260, 720));
    const rows = this._cards.map((r, k) => {
      const loop = off[k] % r.width;
      const slide = (1 - eRows) * (k === 0 ? 240 : -240);
      return {
        cards: r.cards,
        label: k === 0 ? 'Student feedback, part 1' : 'Student feedback, part 2',
        tx: (k === 0 ? -loop : -r.width + loop) + slide,
        op: clamp(eRows * 1.5),
        pause: this._handlers[k].pause, play: this._handlers[k].play,
      };
    });

    return {
      W, L, rows,
      hd: { ty: (1 - eTitle) * 40, op: clamp(eTitle * 2), clip: 108 - 116 * inOut(seg(seen, 200, 620)) },
    };
  }
}
</script>
</body>
</html>
