<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Students of Class C</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Caveat:wght@500;700&amp;family=Kaushan+Script&amp;family=Permanent+Marker&amp;family=Pinyon+Script&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<section aria-label="Students" style="position: relative; width: {{W}}px; box-sizing: border-box; padding: {{L.pad}}; overflow: hidden; background-color: #E9E6DF; background-image: radial-gradient(rgba(23,24,26,0.14) 1px, transparent 1.4px); background-size: 22px 22px; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #17181A">
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; background-image: radial-gradient(60% 30% at 20% 0%, rgba(255,248,228,0.7), rgba(255,248,228,0) 70%)"></div>
  <svg aria-hidden="true" width="100%" height="100%" style="position: absolute; left: 0; top: 0; opacity: 0.55; mix-blend-mode: multiply; pointer-events: none">
    <filter id="dt-grain-students"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix><feComponentTransfer><feFuncA type="linear" slope="0.28"></feFuncA></feComponentTransfer></filter>
    <rect width="100%" height="100%" filter="url(#dt-grain-students)"></rect>
  </svg>

  <div style="position: relative; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; margin-bottom: {{L.headGap}}px">
    <div>
      <p style="margin: 0; font-size: 13px; font-weight: 650; letter-spacing: 0.16em; text-transform: uppercase; color: #3B3934">04 — The class</p>
      <h2 style="margin: 10px 0 0; font-size: {{L.h2}}px; font-weight: 750; line-height: 1; letter-spacing: -0.03em">50 students. One wall.</h2>
    </div>
    <p style="margin: 0 0 4px; font-family: 'Caveat', cursive; font-weight: 700; font-size: {{L.sub}}px; color: #3B3934; transform: rotate(-2deg)">Design Thinking Class C · First Semester, 2026</p>
  </div>

  <ul style="position: relative; list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: {{L.gap}}px">
    <sc-for list="{{students}}" as="s" hint-placeholder-count="8">
      <li style="position: relative; width: {{s.w}}px; box-sizing: border-box; padding: {{L.cardPad}}px {{L.cardPad}}px {{L.cardBottom}}px; background-color: #FDFCF8; box-shadow: {{s.shadow}}; transform: {{s.tf}}; opacity: {{s.op}}">
        <div aria-hidden="true" style="position: absolute; left: 50%; top: -6px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background-color: {{s.pin}}; background-image: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.7) 0 2px, rgba(255,255,255,0) 3px); box-shadow: 2px 3px 3px rgba(40,30,20,0.3); opacity: {{s.pinOp}}; z-index: 1"></div>
        <div style="position: relative; aspect-ratio: 1 / 1; overflow: hidden; background-color: #CFCAC0; background-image: repeating-linear-gradient(135deg, rgba(23,24,26,0.05) 0 2px, transparent 2px 10px)">
          <svg role="img" aria-label="[Student photo]" width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="xMidYMax meet" style="position: absolute; left: 0; bottom: 0"><circle cx="50" cy="40" r="17" fill="#A29C91"></circle><path d="M14 100 C16 72 32 62 50 62 C68 62 84 72 86 100Z" fill="#A29C91"></path></svg>
          <span aria-hidden="true" style="position: absolute; left: 6px; top: 5px; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: rgba(23,24,26,0.55); font-variant-numeric: tabular-nums">{{s.num}}</span>
        </div>
        <p style="margin: 8px 0 0; font-family: 'Caveat', cursive; font-weight: 700; font-size: {{L.name}}px; line-height: 1.05; color: #1F1B16">[Full name]</p>
        <p style="margin: 2px 0 0; font-size: {{L.nrp}}px; font-weight: 600; letter-spacing: 0.04em; color: #55534E; font-variant-numeric: tabular-nums">NRP [NRP]</p>
      </li>
    </sc-for>
  </ul>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"seen":{"editor":"int","default":100000},"width":{"editor":null,"default":1440},"$preview":{"width":1440,"height":2060}}'>
class Component extends DCLogic {
  renderVals() {
    const W = Number(this.props.width ?? 1440);
    const seen = Number(this.props.seen ?? 100000); // px of this section scrolled into view
    const mobile = W < 700;
    const clamp = (v) => Math.min(1, Math.max(0, v));
    const outBack = (v) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(v - 1, 3) + c * Math.pow(v - 1, 2); };
    const rnd = (i, k) => { const r = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453; return r - Math.floor(r); };
    const PINS = ['#D2493A', '#2F6FDB', '#E8B53A', '#3E9B5B', '#E07A2E'];

    const L = mobile
      ? { pad: '56px 16px 64px', cols: 3, gap: 14, cardPad: 6, cardBottom: 10, name: 15, nrp: 10, h2: 34, sub: 22, headGap: 28, gridTop: 170 }
      : { pad: '96px 64px 112px', cols: 8, gap: 28, cardPad: 8, cardBottom: 14, name: 19, nrp: 12, h2: 56, sub: 28, headGap: 48, gridTop: 260 };
    const inner = W - (mobile ? 32 : 128);
    const cardW = (inner - (L.cols - 1) * L.gap) / L.cols;
    const rowH = cardW + (mobile ? 50 : 62) + L.gap; // photo + caption + gap, close enough to place reveals

    // Each row drops in and gets pinned as it scrolls into view.
    const students = [];
    for (let i = 0; i < 50; i++) {
      const row = Math.floor(i / L.cols);
      const col = i % L.cols;
      const r = clamp((seen - L.gridTop - row * rowH - 60 - col * 14) / 220);
      const e = outBack(r);
      const tilt = (rnd(i, 1) - 0.5) * 6;
      students.push({
        num: String(i + 1).padStart(2, '0'), w: Math.floor(cardW),
        tf: 'translateY(' + -(1 - e) * 70 + 'px) rotate(' + (tilt + (1 - r) * (i % 2 ? 14 : -14)) + 'deg) scale(' + (0.9 + 0.1 * e) + ')',
        op: clamp(r * 3),
        shadow: r >= 1
          ? '0 1px 2px rgba(40,30,20,0.2), 0 8px 14px -6px rgba(40,30,20,0.3)'
          : '0 18px 26px -8px rgba(40,30,20,0.3)',
        pin: PINS[i % 5], pinOp: clamp((r - 0.85) / 0.15),
      });
    }
    return { W, L, students };
  }
}
</script>
</body>
</html>
